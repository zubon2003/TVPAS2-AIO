<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Realtime Race Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --neon-blue: #00ffff; --neon-pink: #ff00de; --neon-green: #39ff14;
            --neon-yellow: #ffcc00; --neon-red: #ff3333; --bg-glass: rgba(0, 0, 0, 0.95);
            --row-height: 145px;
        }
        body { margin: 0; padding: 30px; background-color: transparent; overflow: hidden; font-family: 'Orbitron', sans-serif; color: white; height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; }
        #feed-container { width: 100%; position: relative; height: calc(var(--row-height) * 4); }
        .pilot-row {
            position: absolute; left: 0; width: 100%; box-sizing: border-box;
            background: var(--bg-glass); border-left: 8px solid var(--neon-blue); padding: 15px 25px; display: grid;
            grid-template-columns: 70px 280px 220px 1fr; align-items: start; border-radius: 0 15px 15px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8); height: 130px; 
            transition: top 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, background 0.3s ease;
            padding-top: 15px; display: none;
        }
        .active-row { display: grid !important; }
        .rank { font-size: 2.2rem; font-weight: 900; color: var(--neon-yellow); text-align: center; margin-top: 5px; }
        .pilot-info { display: flex; flex-direction: column; padding-left: 10px; margin-top: 5px; }
        .name { font-size: 1.5rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lap-badge { font-size: 1.3rem; color: var(--neon-blue); font-weight: bold; font-family: 'Audiowide', cursive; }
        .stopwatch-container { background: rgba(255, 0, 222, 0.15); border: 2px solid rgba(255, 0, 222, 0.4); border-radius: 8px; padding: 5px 10px; text-align: center; margin-right: 20px; width: 180px; margin-top: 0px; }
        .stopwatch-time { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; font-size: 2.2rem; font-weight: 700; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); letter-spacing: 1px; }
        .paused { color: var(--neon-green) !important; text-shadow: 0 0 15px var(--neon-green) !important; }
        .sector-grid { display: grid; grid-template-columns: repeat(4, 110px); gap: 15px; border-left: 2px solid rgba(255,255,255,0.3); padding-left: 25px; margin-top: 5px; }
        .sec-label { font-size: 0.8rem; color: #fff; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 2px; text-shadow: 0 0 5px rgba(0,0,0,1); }
        .sector-val { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; font-size: 1.3rem; color: #aaa; font-weight: bold; }
        .val-active { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .history-bar { grid-column: 1 / -1; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); display: flex; gap: 10px; min-height: 35px; overflow: hidden; position: absolute; bottom: 8px; width: calc(100% - 50px); left: 25px; }
        .history-item { background: rgba(255,255,255,0.08); padding: 3px 12px; border-radius: 5px; color: #eee; font-size: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        .waiting { opacity: 0.4; border-left-color: #333; }
        .finished { border-left-color: var(--neon-green); }
        .hs-active { color: var(--neon-red); }
        .finished-text { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .flash { animation: flash-cyan 0.6s ease-out; }
        @keyframes flash-cyan { 0% { background: rgba(0, 255, 255, 0.5); } 100% { background: var(--bg-glass); } }
    </style>
</head>
<body>
    <div id="feed-container">
        <div class="pilot-row" id="row-0"><div class="rank" id="rank-0">#1</div><div class="pilot-info"><div class="name" id="name-0"></div><div class="lap-badge" id="lap-0">READY</div></div><div class="stopwatch-container"><div class="stopwatch-time" id="watch-0">0.000</div></div><div class="sector-grid"><div class="sector-item"><div class="sec-label">SEC 1</div><div class="sector-val" id="s1-0">---</div></div><div class="sector-item"><div class="sec-label">SEC 2</div><div class="sector-val" id="s2-0">---</div></div><div class="sector-item"><div class="sec-label">SEC 3</div><div class="sector-val" id="s3-0">---</div></div><div class="sector-item"><div class="sec-label">SEC 4</div><div class="sector-val" id="s4-0">---</div></div></div><div class="history-bar" id="hist-0"></div></div>
        <div class="pilot-row" id="row-1"><div class="rank" id="rank-1">#2</div><div class="pilot-info"><div class="name" id="name-1"></div><div class="lap-badge" id="lap-1">READY</div></div><div class="stopwatch-container"><div class="stopwatch-time" id="watch-1">0.000</div></div><div class="sector-grid"><div class="sector-item"><div class="sec-label">SEC 1</div><div class="sector-val" id="s1-1">---</div></div><div class="sector-item"><div class="sec-label">SEC 2</div><div class="sector-val" id="s2-1">---</div></div><div class="sector-item"><div class="sec-label">SEC 3</div><div class="sector-val" id="s3-1">---</div></div><div class="sector-item"><div class="sec-label">SEC 4</div><div class="sector-val" id="s4-1">---</div></div></div><div class="history-bar" id="hist-1"></div></div>
        <div class="pilot-row" id="row-2"><div class="rank" id="rank-2">#3</div><div class="pilot-info"><div class="name" id="name-2"></div><div class="lap-badge" id="lap-2">READY</div></div><div class="stopwatch-container"><div class="stopwatch-time" id="watch-2">0.000</div></div><div class="sector-grid"><div class="sector-item"><div class="sec-label">SEC 1</div><div class="sector-val" id="s1-2">---</div></div><div class="sector-item"><div class="sec-label">SEC 2</div><div class="sector-val" id="s2-2">---</div></div><div class="sector-item"><div class="sec-label">SEC 3</div><div class="sector-val" id="s3-2">---</div></div><div class="sector-item"><div class="sec-label">SEC 4</div><div class="sector-val" id="s4-2">---</div></div></div><div class="history-bar" id="hist-2"></div></div>
        <div class="pilot-row" id="row-3"><div class="rank" id="rank-3">#4</div><div class="pilot-info"><div class="name" id="name-3"></div><div class="lap-badge" id="lap-3">READY</div></div><div class="stopwatch-container"><div class="stopwatch-time" id="watch-3">0.000</div></div><div class="sector-grid"><div class="sector-item"><div class="sec-label">SEC 1</div><div class="sector-val" id="s1-3">---</div></div><div class="sector-item"><div class="sec-label">SEC 2</div><div class="sector-val" id="s2-3">---</div></div><div class="sector-item"><div class="sec-label">SEC 3</div><div class="sector-val" id="s3-3">---</div></div><div class="sector-item"><div class="sec-label">SEC 4</div><div class="sector-val" id="s4-3">---</div></div></div><div class="history-bar" id="hist-3"></div></div>
    </div>

    <script>
        const socket = io((location.protocol === 'file:') ? 'http://localhost:5050' : (location.protocol + '//' + location.host));
        let pilotStates = {};
        const ROW_HEIGHT = 145;
        
        function initStates() {
            for(let i=0; i<4; i++) {
                if(pilotStates[i] && pilotStates[i].timerId) cancelAnimationFrame(pilotStates[i].timerId);
                pilotStates[i] = { timerId: null, startTime: 0, offset: null, isFinished: false, pauseUntil: 0, hasPilot: false };
                const row = document.getElementById(`row-${i}`);
                if(row) { row.style.top = `${i * ROW_HEIGHT}px`; row.classList.remove('active-row'); row.classList.add('waiting'); }
            }
        }
        initStates();

        socket.on("race_lap_update", (data) => updateUI(data));
        
        function softReset() {
            initStates();
            for(let i=0; i<4; i++) {
                const row = document.getElementById(`row-${i}`);
                row.classList.remove('finished', 'active-row');
                row.classList.add('waiting');
                document.getElementById(`name-${i}`).innerText = '';
                document.getElementById(`lap-${i}`).innerText = 'READY';
                document.getElementById(`watch-${i}`).innerText = '0.000';
                document.getElementById(`watch-${i}`).classList.remove('paused');
                document.getElementById(`hist-${i}`).innerHTML = '';
                for(let s=1; s<=4; s++) {
                    const el = document.getElementById(`s${s}-${i}`);
                    el.innerText = '---'; el.classList.remove('val-active');
                }
            }
        }

        socket.on("race_start", softReset);
        socket.on("race_reset", softReset);

        function updateUI(data) {
            const i = data.seat;
            if (i < 0 || i > 3) return;
            const state = pilotStates[i];
            const row = document.getElementById(`row-${i}`);
            
            if (data.pilot_name && data.pilot_name !== "" && data.pilot_name !== "Waiting...") {
                state.hasPilot = true;
                row.classList.add('active-row');
                document.getElementById(`name-${i}`).innerText = data.pilot_name;
                row.classList.remove('waiting');
            } else if (!data.pilot_name) {
                // 名前が完全になければ非表示
                row.classList.remove('active-row');
                state.hasPilot = false;
                return; 
            }

            if (data.all_positions) {
                const activeOnes = Object.keys(pilotStates)
                    .filter(id => pilotStates[id].hasPilot)
                    .map(id => ({ id: id, pos: data.all_positions[id] || 99 }))
                    .sort((a, b) => a.pos - b.pos);

                activeOnes.forEach((p, index) => {
                    const targetRow = document.getElementById(`row-${p.id}`);
                    const rankEl = document.getElementById(`rank-${p.id}`);
                    if (targetRow) targetRow.style.top = `${index * ROW_HEIGHT}px`;
                    if (rankEl) rankEl.innerText = `#${p.pos}`;
                });
            }

            if (data.is_finished) { row.classList.add('finished'); state.isFinished = true; }
            const lapEl = document.getElementById(`lap-${i}`);
            if (data.is_finished) lapEl.innerHTML = '<span class="finished-text">FINISHED</span>';
            else if (data.is_holeshot) lapEl.innerHTML = '<span class="hs-active">HOLESHOT</span>';
            else if (data.lap_number >= 0) lapEl.innerText = `LAP ${data.lap_number}`;

            const sectors = data.final_sectors || data.sectors || {};
            for(let s=1; s<=4; s++) {
                const el = document.getElementById(`s${s}-${i}`);
                const val = sectors[`s${s}`];
                if (val !== undefined && val !== null) el.innerText = val.toFixed(3);
                if (data.sector_index === s) el.classList.add('val-active'); else el.classList.remove('val-active');
            }

            if (data.history && data.history.length > 0) {
                const histEl = document.getElementById(`hist-${i}`);
                histEl.innerHTML = [...data.history].reverse().map((t, idx) => {
                    const oIdx = data.history.length - 1 - idx;
                    return `<div class="history-item"><span style="color:var(--neon-yellow);font-size:0.75rem;font-weight:bold">${oIdx==0?'HS':'L'+oIdx}</span> <b>${t.toFixed(3)}</b></div>`;
                }).join('');
            }

            if (data.event === 'lap_update') {
                row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 600);
                if (data.lap_time > 0) {
                    const watchEl = document.getElementById(`watch-${i}`);
                    watchEl.innerText = data.lap_time.toFixed(3);
                    watchEl.classList.add('paused'); state.pauseUntil = Date.now() + 3000;
                }
            }

            if (data.lap_start_mono > 0 && !state.isFinished) {
                state.startTime = data.lap_start_mono;
                if (state.offset === null) state.offset = (performance.now() / 1000) - data.server_now;
                if (!state.timerId) startTimer(i);
            }

            if (state.isFinished) {
                if (state.timerId) cancelAnimationFrame(state.timerId);
                state.timerId = null;
                const lastTime = data.history && data.history.length > 0 ? data.history[data.history.length-1] : 0;
                if(lastTime > 0) document.getElementById(`watch-${i}`).innerText = lastTime.toFixed(3);
            }
        }

        function startTimer(seat) {
            const el = document.getElementById(`watch-${seat}`);
            function tick() {
                const state = pilotStates[seat];
                if (!state || !state.startTime || state.isFinished) return;
                if (Date.now() > state.pauseUntil) {
                    el.classList.remove('paused');
                    const nowServer = (performance.now() / 1000) - state.offset;
                    const elapsed = Math.max(0, nowServer - state.startTime);
                    el.innerText = elapsed.toFixed(3);
                }
                state.timerId = requestAnimationFrame(tick);
            }
            pilotStates[seat].timerId = requestAnimationFrame(tick);
        }
    </script>
</body>
</html>
