<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: transparent; 
            color: #f1f5f9; 
            font-family: 'Noto Sans JP', sans-serif; 
            margin: 0; 
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #obs-area { 
            background: #000a14; 
            color: #00f2ff; /* Unified color with Next Heat */
            width: 1840px;
            padding: 40px; 
            border: 1px solid #004466; 
            border-radius: 8px;
            position: relative;
        }
        .sf-title { 
            font-family: 'Orbitron'; 
            text-shadow: 0 0 10px #00f2ff; 
            border-bottom: 2px solid #00f2ff; 
            padding-bottom: 10px; 
            margin-bottom: 40px; 
            text-transform: uppercase; 
        }
        .pilot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }
        .sf-card { 
            background: rgba(0, 242, 255, 0.05); 
            border-left: 6px solid;
            padding: 0;
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            clip-path: polygon(0 0, 95% 0, 100% 20px, 100% 100%, 5% 100%, 0 95%);
        }
        .pilot-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 10, 20, 0.9) 0%, rgba(0, 10, 20, 0) 100%);
            z-index: 2;
        }
        .pilot-name {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 4px;
            word-break: break-all;
        }
        .pilot-band {
            font-family: 'Orbitron';
            font-size: 1.5rem;
            font-weight: 900;
        }
        .rank-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Orbitron';
            font-size: 3rem;
            font-weight: 900;
            font-style: italic;
            text-shadow: 0 0 15px currentColor;
            z-index: 3;
        }
        .time-badge {
            font-family: 'Orbitron';
            font-size: 1.2rem;
            color: #94a3b8;
        }
        .no-data {
            text-align: center;
            font-size: 3rem;
            font-family: 'Orbitron';
            color: #334155;
            padding: 100px 0;
        }
    </style>
</head>
<body>

    <div id="obs-area">
        <div class="flex justify-between items-end sf-title">
            <h1 class="text-6xl font-black italic">Race Results</h1>
            <h2 id="last-heat-name" class="text-4xl font-black italic opacity-90">---</h2>
        </div>

        <div id="pilot-display-area" class="pilot-grid">
            <!-- Result cards -->
        </div>

        <div id="no-data-message" class="no-data" style="display: none;">
            No Result
        </div>

        <!-- Bottom Line -->
        <div class="mt-10 border-t-2 border-[#00f2ff] shadow-[0_0_10px_#00f2ff]"></div>
    </div>

    <script>
        async function fetchResult() {
            try {
                const response = await fetch('/api/leaderboard');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();

                const displayArea = document.getElementById('pilot-display-area');
                const noDataMessage = document.getElementById('no-data-message');
                const heatNameEl = document.getElementById('last-heat-name');

                if (data.lastHeatName && data.lastHeatName !== '---' && data.lastHeatResult && data.lastHeatResult.length > 0) {
                    noDataMessage.style.display = 'none';
                    displayArea.style.display = 'grid';
                    heatNameEl.textContent = data.lastHeatName;
                    
                    const themeColors = ['#b04a5a', '#4a8eb0', '#5ab04a', '#b0a44a'];

                    displayArea.innerHTML = data.lastHeatResult.slice(0, 4).map((pilot, index) => {
                        const themeColor = themeColors[index] || '#00f2ff';
                        const imageUrl = pilot.photopath 
                            ? `/api/pilot_image?path=${encodeURIComponent(pilot.photopath)}` 
                            : `/image.png`;

                        // POS.X または ? 等を表示
                        const rankText = (pilot.rank !== null && pilot.rank !== undefined) ? `POS.${pilot.rank}` : '';
                        
                        // Backend now provides pre-formatted "RECORD: ...   NEXT: ..."
                        const scoreText = pilot.displayValue || 'RECORD: NO RECORD';

                        return `
                            <div class="sf-card" style="border-left-color: ${themeColor};">
                                <img src="${imageUrl}" class="pilot-image" onerror="this.onerror=null; this.src='/image.png';">
                                ${rankText ? `<div class="rank-badge" style="color: ${themeColor};">${rankText}</div>` : ''}
                                <div class="card-overlay">
                                    <div class="pilot-band" style="color: ${themeColor}">${pilot.band || '---'}</div>
                                    <div class="pilot-name">${pilot.pilotName || 'UNKNOWN'}</div>
                                    <div class="time-badge text-right" style="color: ${themeColor}">${scoreText}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    displayArea.style.display = 'none';
                    noDataMessage.style.display = 'block';
                    heatNameEl.textContent = '---';
                }
            } catch (e) { console.error('Error:', e); }
        }
        fetchResult();
        setInterval(fetchResult, 5000);
    </script>
</body>
</html>
