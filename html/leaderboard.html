<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Noto+Sans+JP:wght@700;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        /* スクロールバーを完全に隠す */
        * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }

        body { 
            background: #0f172a; color: #f1f5f9; font-family: 'Noto Sans JP', sans-serif; 
            margin: 0; padding: 10px; height: 100vh; overflow: hidden; 
        }
        #obs-area { 
            background: #000a14; color: #00f2ff; height: calc(100vh - 20px); 
            padding: 20px 40px; border: 1px solid #004466; border-radius: 8px;
            display: flex; flex-direction: column;
        }
        .sf-title { 
            font-family: 'Orbitron'; text-shadow: 0 0 10px #00f2ff; 
            border-bottom: 2px solid #00f2ff; padding-bottom: 5px; margin-bottom: 15px; 
            text-transform: uppercase; flex-shrink: 0;
        }
        #ranking-list { flex-grow: 1; overflow: hidden; }
        .sf-row { 
            background: rgba(0, 242, 255, 0.05); border-left: 6px solid #00f2ff; margin-bottom: 8px; padding: 10px 20px;
            clip-path: polygon(0 0, 98% 0, 100% 20px, 100% 100%, 2% 100%, 0 80%);
            min-height: 80px;
        }
        .font-mono-custom { font-family: 'Roboto Mono', 'Orbitron', monospace; }
        
        /* 順位の色定義 (コントラストを強化) */
        .rank-gold { color: #FFD700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.7); }
        .rank-silver { color: #F8F8FF; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); } /* より白く光る銀 */
        .rank-bronze { color: #CD7F32; text-shadow: 0 0 15px rgba(205, 127, 50, 0.7); }
        .rank-other { color: #64748b; } /* 明確に暗い灰色 (Slate 500) */
    </style>
</head>
<body>

    <div id="obs-area">
        <div class="flex justify-between items-end sf-title">
            <h1 id="title-text" class="text-5xl font-black italic">Leaderboard</h1>
            <div id="page-indicator" class="text-xl font-mono mb-1">PAGE 1/1</div>
        </div>
        <div id="ranking-list" class="space-y-2">
            <!-- Ranking rows will be inserted here -->
        </div>
    </div>

    <script>
        const rankingList = document.getElementById('ranking-list');
        const pageIndicator = document.getElementById('page-indicator');
        
        let allData = [];
        let currentPage = 0;
        let itemsPerPage = 8;

        function calculateItemsPerPage() {
            const availableHeight = rankingList.clientHeight;
            const calculated = Math.floor(availableHeight / 95); 
            itemsPerPage = Math.max(1, calculated);
        }

        function updateData() {
            fetch('/api/leaderboard')
                .then(res => res.json())
                .then(data => {
                    allData = data.ranking || [];
                    calculateItemsPerPage();
                    render();
                })
                .catch(err => console.error('Fetch error:', err));
        }

        function render() {
            if (allData.length === 0) {
                rankingList.innerHTML = '<div class="text-center text-4xl mt-20 text-slate-700">WAITING FOR DATA...</div>';
                pageIndicator.innerText = '';
                return;
            }

            const totalPages = Math.ceil(allData.length / itemsPerPage);
            if (currentPage >= totalPages) currentPage = 0;

            const start = currentPage * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = allData.slice(start, end);

            pageIndicator.innerText = `PAGE ${currentPage + 1}/${totalPages}`;

            rankingList.innerHTML = pageItems.map((p, i) => {
                const globalIndex = start + i;
                const rankNum = globalIndex + 1;
                
                let rankColorClass = 'rank-other';
                if (p.time !== null) {
                    if (globalIndex === 0) rankColorClass = 'rank-gold';
                    else if (globalIndex === 1) rankColorClass = 'rank-silver';
                    else if (globalIndex === 2) rankColorClass = 'rank-bronze';
                }
                
                const rankText = p.time ? `#${rankNum}`.padEnd(3, '\u00A0') : '#-- ';

                let timeStr = p.displayTime ? p.displayTime : (p.time ? p.time.toFixed(3) + 's' : '--.---');
                if (timeStr.includes('Laps')) {
                    const parts = timeStr.split(' ');
                    const formattedTime = parts[2].padStart(8, '\u00A0');
                    timeStr = `${parts[0]} Laps ${formattedTime}`;
                } else if (p.time) {
                    timeStr = timeStr.padStart(8, '\u00A0');
                }

                return `
                    <div class="sf-row flex justify-between items-center transition-all duration-500">
                        <div class="flex items-center gap-10">
                            <span class="text-3xl italic font-black font-mono-custom whitespace-pre ${rankColorClass}">${rankText}</span>
                            <span class="text-3xl font-black uppercase text-white">${p.pilotName}</span>
                        </div>
                        <span class="text-4xl font-mono-custom font-black text-right whitespace-pre">${timeStr}</span>
                    </div>
                `;
            }).join('');
        }

        function nextStep() {
            if (allData.length > itemsPerPage) {
                currentPage = (currentPage + 1) % Math.ceil(allData.length / itemsPerPage);
                render();
            } else {
                currentPage = 0;
                render();
            }
        }

        window.addEventListener('resize', () => {
            calculateItemsPerPage();
            render();
        });

        updateData();
        setInterval(updateData, 10000);
        setInterval(nextStep, 5000);
    </script>
</body>
</html>
